services:
  app:
    build: .
    stdin_open: true
    tty: true
    environment:
      DB_PATH: /data/rental-tracker.db
      RENTAL_TRACKER_LOG_PATH: /logs/rental-tracker.log
    volumes:
      - rental-tracker-data:/data
      - rental-tracker-logs:/logs

volumes:
  rental-tracker-data:
  rental-tracker-logs: